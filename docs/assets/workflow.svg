font-family="Arial,sans-serif" font-size="22" fill="#ffffff" font-weight="700">Create</text><text x="532" y="127" font-family="Arial,sans-serif" font-size="14" fill="#b9cbd6">Actual files / code</text><rect x="753" y="70" width="190" height="80" rx="14" fill="#213e4d" stroke="#456575"/><text x="771" y="101" font-family="Arial,sans-serif" font-size="22" fill="#ffffff" font-weight="700">Verify</text><text x="771" y="127" font-family="Arial,sans-serif" font-size="14" fill="#b9cbd6">Fresh checks</text><rect x="753" y="232" width="190" height="80" rx="14" fill="#213e4d" stroke="#456575"/><text x="771" y="263" font-family="Arial,sans-serif" font-size="22" fill="#ffffff" font-weight="700">Review</text><text x="771" y="289" font-family="Arial,sans-serif" font-size="14" fill="#b9cbd6">Independent verdict</text><rect x="514" y="232" width="190" height="80" rx="14" fill="#213e4d" stroke="#456575"/><text x="532" y="263" font-family="Arial,sans-serif" font-size="22" fill="#ffffff" font-weight="700">Repair</text><text x="532" y="289" font-family="Arial,sans-serif" font-size="14" fill="#b9cbd6">Concrete defects</text><rect x="275" y="232" width="190" height="80" rx="14" fill="#213e4d" stroke="#456575"/><text x="293" y="263" font-family="Arial,sans-serif" font-size="22" fill="#ffffff" font-weight="700">Deliver</text><text x="293" y="289" font-family="Arial,sans-serif" font-size="14" fill="#b9cbd6">Owner-only files</text><text x="38" y="380" font-family="Arial,sans-serif" font-size="15" fill="#b9cbd6">Approved current evidence enables delivery. Unresolved work remains visible for attention.</text></svg>